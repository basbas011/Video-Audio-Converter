name: Release bouwen

# Start automatisch zodra je op GitHub een release publiceert
# (Releases -> Draft a new release -> tag bijv. v2.4.0 -> Publish release).
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: NSIS installeren
        run: sudo apt-get update -q && sudo apt-get install -y -q nsis

      - name: Installer bouwen
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          PYTHON=python bash scripts/build_installer.sh "$VERSION"

      - name: Installer aan de release toevoegen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: dist/Video-Audio-Converter-Setup.exe
